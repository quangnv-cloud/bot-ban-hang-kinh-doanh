    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Seeded PRNG (deterministic — no Math.random()/Date.now()).
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(20261030);
      var starsSvg = document.getElementById("bg-stars");
      var starEls = [];
      for (var i = 0; i < 40; i++) {
        var cx = rand() * 1080;
        var cy = rand() * 1920;
        var r = 1.5 + rand() * 1.5;
        var op = 0.15 + rand() * 0.25;
        var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", cx.toFixed(1));
        c.setAttribute("cy", cy.toFixed(1));
        c.setAttribute("r", r.toFixed(2));
        c.setAttribute("fill", "#ffffff");
        c.setAttribute("opacity", op.toFixed(2));
        starsSvg.appendChild(c);
        starEls.push(c);
      }

      // Bounded repeats (not -1) — this project's HyperFrames version disallows
      // infinite repeat even on the root; 18s * (1 + 2 yoyo legs) = 54s = full video.
      tl.to(".blob", { x: "+=40", y: "-=30", duration: 18, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 3 }, 0);
      tl.to(starEls, { opacity: "+=0.22", duration: 4, ease: "sine.inOut", repeat: 14, yoyo: true, stagger: { each: 0.15, from: "random" } }, 0);

      // Brand anchor fade-in right as Hook ends.
      tl.fromTo("#brand-anchor-logo", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.192);
      tl.fromTo("#brand-anchor-source", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.192);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
