  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.2s): top label fades in.
      tl.fromTo(
        "#fdmTopLabel",
        { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        0.15
      );

      // Scene 2 (1.2-3.0s): hero row becomes visible, "407" counts up with
      // transform-scale growth (counting-dynamic-scale), a subtle accent
      // line draws under it on the same timing (stat-bars-and-fills), and
      // the "TỶ" suffix pops in once the count lands.
      tl.fromTo(
        "#fdmHeroRow",
        { opacity: 0 },
        { opacity: 1, duration: 0.15, ease: "power1.out" },
        1.15
      );

      var counterEl = document.getElementById("fdmCounter");
      var counterState = { value: 0 };
      var COUNT_START = 1.3;
      var COUNT_DUR = 1.7;

      tl.to(
        counterState,
        {
          value: 407,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            counterEl.textContent = Math.round(counterState.value).toLocaleString("vi-VN");
          },
        },
        COUNT_START
      );

      tl.fromTo(
        "#fdmCounter",
        { scale: 0.45 },
        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        COUNT_START
      );

      tl.fromTo(
        "#fdmAccentLine",
        { scaleX: 0 },
        { scaleX: 1, duration: COUNT_DUR, ease: "power2.out" },
        COUNT_START
      );

      tl.fromTo(
        "#fdmSuffix",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
        COUNT_START + COUNT_DUR
      );

      // Scene 3 (3.4-4.6s): a single fire-orange -> cream -> fire-orange
      // sheen sweeps once through "407" (gradient-text-sweep, one-pass
      // sheen inside type) then settles back to flat orange; right after,
      // the "TỔNG CẢ NĂM 2025" label fades in below.
      tl.fromTo(
        "#fdmCounter",
        { backgroundPosition: "0% 50%" },
        { backgroundPosition: "100% 50%", duration: 0.8, ease: "none" },
        3.4
      );

      tl.fromTo(
        "#fdmCondLabel",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        4.5
      );

      // Scene 4 (5.5-8.1s): secondary stat pops in, then holds with a
      // subtle, bounded jitter (sine-wave-loop, finite yoyo form) through
      // the end of the frame.
      tl.fromTo(
        "#fdmSecondaryStat",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.5
      );

      tl.to(
        "#fdmSecondaryStat",
        { y: "+=3", duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 2 },
        6.1
      );

      window.__timelines["04-data-moment"] = tl;
    })();
