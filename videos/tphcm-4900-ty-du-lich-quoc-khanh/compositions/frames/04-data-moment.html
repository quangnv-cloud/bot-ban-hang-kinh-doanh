          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#dm-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.15);
          tl.fromTo("#dm-old", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 0.5);
          tl.fromTo("#dm-vs", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.85);
          tl.fromTo("#dm-new", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 1.05);

          var counter = { val: 0 };
          tl.to(
            counter,
            {
              val: 55000,
              duration: 1.0,
              ease: "power2.out",
              onUpdate: function () {
                document.getElementById("dm-new-value").textContent = Math.round(counter.val).toLocaleString("vi-VN");
              },
            },
            1.2,
          );

          tl.fromTo("#dm-caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 2.55);
          tl.fromTo("#dm-place", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.95);
