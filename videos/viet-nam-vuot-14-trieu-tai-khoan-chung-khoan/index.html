    <script>
      var tl = gsap.timeline({ paused: true });

      // seeded PRNG (mulberry32) — deterministic star field
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(20261006141);
      var NS = "http://www.w3.org/2000/svg";
      var starsSvg = document.getElementById("bg-stars");
      for (var i = 0; i < 40; i++) {
        var c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", (rand() * 1080).toFixed(1));
        c.setAttribute("cy", (rand() * 1920).toFixed(1));
        c.setAttribute("r", (1.5 + rand() * 1.5).toFixed(2));
        c.setAttribute("fill", "#fff");
        c.setAttribute("opacity", (0.15 + rand() * 0.25).toFixed(2));
        starsSvg.appendChild(c);
      }

      tl.to("#bg-depth .blob", { x: "+=40", y: "-=30", duration: 18, ease: "sine.inOut", repeat: -1, yoyo: true, stagger: 3 }, 0);
      tl.to("#bg-stars circle", { opacity: "+=0.25", duration: 4, ease: "sine.inOut", repeat: -1, yoyo: true, stagger: { each: 0.15, from: "random" } }, 0);

      window.__timelines["main"] = tl;
