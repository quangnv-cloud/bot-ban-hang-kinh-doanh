  <script>
    (function () {
      function fitLine(id, text, baseSize, minSize, weight, maxWidth) {
        var el = document.getElementById(id);
        if (!el) return;
        if (window.__hyperframes && window.__hyperframes.fitTextFontSize) {
          var fit = window.__hyperframes.fitTextFontSize(text, {
            fontFamily: "Montserrat",
            fontWeight: weight,
            maxWidth: maxWidth || 900,
            baseFontSize: baseSize,
            minFontSize: minSize,
          });
          el.style.fontSize = fit.fontSize + "px";
        } else {
          el.style.fontSize = baseSize + "px";
        }
      }
      fitLine("st02-headline", "Vingroup chuyển nhượng 99,9% cổ phần công ty sản xuất VinFast", 54, 36, 800);

      // Build the decorative ticker-strip bars (deterministic — fixed pattern,
      // no Math.random()). Alternating heights, mostly white/grey with sparse
      // orange highlights — never green, per brand colour rule.
      var track = document.getElementById("st02-ticker-track");
      var pattern = [8, 14, 22, 11, 28, 16, 9, 24, 13, 30, 18, 10, 26, 15, 21, 12];
      var totalCells = 60;
      var cellsHtml = "";
      for (var i = 0; i < totalCells; i++) {
        var h = pattern[i % pattern.length];
        var isAccent = i % 7 === 3;
        var color = isAccent ? "#e8441e" : "rgba(255,255,255," + (0.28 + (h / 30) * 0.4).toFixed(2) + ")";
        cellsHtml += '<div class="st02-ticker-bar" style="height:' + h + 'px;background:' + color + ';"></div>';
      }
      track.innerHTML = cellsHtml;
      var trackWidth = totalCells * 16;
      track.style.width = trackWidth + "px";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      tl.fromTo("#st02-kicker-row", { y: -12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

      tl.fromTo(
        track,
        { x: 0 },
        { x: -(trackWidth - 900), duration: 10.4, ease: "none" },
        0.22,
      );
      tl.fromTo("#st02-headline", { y: 18, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0.42);

        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
