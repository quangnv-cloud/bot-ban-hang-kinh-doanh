    (function () {
      var NS = "http://www.w3.org/2000/svg";

      // Mini candlestick icon — a wick <line> (safe for draw-in) plus a body
      // <rect> that grows by tweening its SVG height/y attributes directly
      // (not CSS transform scaleY + transform-box:fill-box — that combo is
      // unreliable across renderers, same family of footgun as relying on
      // getTotalLength() draw-in for circle/rect/ellipse). Default hidden
      // state is height=0 at the bottom edge, a real collapsed rect, not a
      // CSS-only illusion.
      function buildCandle(container, opts) {
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("width", "64");
        svg.setAttribute("height", opts.h);
        svg.setAttribute("viewBox", "0 0 64 " + opts.h);

        var wick = document.createElementNS(NS, "line");
        wick.setAttribute("x1", "32");
        wick.setAttribute("y1", opts.wickTop);
        wick.setAttribute("x2", "32");
        wick.setAttribute("y2", opts.wickBottom);
        wick.setAttribute("stroke", opts.color);
        wick.setAttribute("stroke-width", "4");
        wick.setAttribute("stroke-linecap", "round");
        wick.style.opacity = "0";
        svg.appendChild(wick);

        var bodyBottom = opts.bodyTop + opts.bodyH;
        var body = document.createElementNS(NS, "rect");
        body.setAttribute("x", "14");
        body.setAttribute("width", "36");
        body.setAttribute("rx", "3");
        body.setAttribute("fill", opts.color);
        body.setAttribute("y", bodyBottom);
        body.setAttribute("height", 0);
        svg.appendChild(body);

        container.appendChild(svg);
        return { wick: wick, body: body, bodyTop: opts.bodyTop, bodyBottom: bodyBottom, bodyH: opts.bodyH };
      }

      var candle1 = buildCandle(document.querySelector('[data-candle="1"]'), {
        h: 92, wickTop: 6, wickBottom: 86, bodyTop: 24, bodyH: 50, color: "#e8441e",

      });
      var candle3 = buildCandle(document.querySelector('[data-candle="3"]'), {

      });
