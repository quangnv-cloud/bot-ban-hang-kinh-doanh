    (function () {
      function formatVN(n) {
        var s = Math.round(n).toString();
        var out = "";
        var count = 0;
        for (var i = s.length - 1; i >= 0; i--) {
          out = s.charAt(i) + out;
          count++;
          if (count % 3 === 0 && i !== 0) out = "." + out;
        }
        return out;
      }
