      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#kf-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.1);
          tl.fromTo("#kf-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.25);

          function row(sel, valSel, target, at) {
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
            tl.fromTo(sel + " .lb", { x: -50 }, { x: 0, duration: 0.45, ease: "power3.out" }, at);
            tl.fromTo(sel + " .val", { x: 50 }, { x: 0, duration: 0.45, ease: "power3.out" }, at);
            tl.fromTo(sel + " .mid", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, at + 0.05);
            var o = { v: 0 };
            var el = document.querySelector(valSel);
            tl.fromTo(o, { v: 0 }, { v: target, duration: 0.7, ease: "power2.out",
              onUpdate: function () { el.textContent = String(Math.round(o.v)); } }, at + 0.05);
          }
          row("#kf-r1", "#kf-v1", 150, 0.9);
          row("#kf-r2", "#kf-v2", 21, 2.6);
          row("#kf-r3", "#kf-v3", 16, 4.3);
          row("#kf-r4", "#kf-v4", 5, 5.2);
          tl.to({}, { duration: 7.144 }, 0);
          window.__timelines["03-key-facts"] = tl;
