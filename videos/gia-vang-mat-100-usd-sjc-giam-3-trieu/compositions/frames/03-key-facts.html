        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #111111;
          font-family: "Montserrat", Arial, sans-serif;
          color: #ffffff;
        }

        /* Map & Geo — Key facts: simplified Việt Nam outline as a faint watermark behind the fact
           list. Facts tied to the domestic market get a small pin icon; the world-market fact does
           not (avoids implying a figure is domestic when it is not). */
        .kf-map-wrap {
          position: absolute;
          right: -60px; top: 260px;
          width: 420px; height: 980px;
          opacity: 0;
        }
        .kf-map-wrap svg { width: 100%; height: 100%; }
        .kf-map-wrap path {
          fill: none;
          stroke: rgba(255, 255, 255, 0.14);
          stroke-width: 2.5;
        }

        .kf-kicker {
          position: absolute; left: 64px; top: 240px;
          font-weight: 700; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase;
          color: rgba(255, 255, 255, 0.65);
          max-width: 700px;
          opacity: 0;
        }

        .kf-rows { position: absolute; left: 64px; right: 64px; top: 330px; }
        .kf-row {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 24px;
          padding: 40px 0;
          border-top: 1.5px solid rgba(255, 255, 255, 0.16);
        }
        .kf-row:last-child { border-bottom: 1.5px solid rgba(255, 255, 255, 0.16); }
        .kf-row-left { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; }
        .kf-row-pin { width: 28px; height: 28px; flex: none; opacity: 0; }
        .kf-row-pin svg { width: 100%; height: 100%; }
        .kf-row-label {
          font-weight: 600; font-size: 25px; line-height: 1.28;
          color: rgba(255, 255, 255, 0.8);
          max-width: 470px;
          opacity: 0;
        }
        .kf-row-value {
          font-weight: 900; font-size: 46px; letter-spacing: -0.02em;
          color: #e8441e;
          font-variant-numeric: tabular-nums;
          text-align: right;
          white-space: nowrap;
          opacity: 0;
        }
        .kf-row-value .unit { font-size: 24px; font-weight: 700; display: block; color: rgba(255,255,255,0.55); margin-top: 4px; }
        .kf-divider-v {
          position: absolute;
          left: 50%; top: 6px; bottom: 6px;
          width: 1.5px;
          background: rgba(232, 68, 30, 0.4);
          transform-origin: center;
          transform: scaleY(0);
        }

      <div id="root" data-composition-id="03-key-facts" data-width="1080" data-height="1920">
        <div class="kf-map-wrap" id="kf-map" data-layout-allow-overflow="true">
          <svg viewBox="0 0 300 700" preserveAspectRatio="xMidYMid meet">
            <path d="M150,20 C190,20 210,60 200,110 C190,160 150,180 140,230 C130,280 170,300 190,350 C210,400 170,420 150,470 C130,520 90,520 80,570 C70,620 100,650 130,680 L110,680 C70,650 40,610 55,560 C70,510 110,500 125,460 C140,420 100,400 85,350 C70,300 110,280 120,230 C130,180 90,160 80,110 C70,60 110,20 150,20 Z" />

        <span class="kf-kicker" id="kf-kicker">Vàng trong nước &amp; thế giới sáng 2/9</span>

        <div class="kf-rows">
          <div class="kf-row">
            <div class="kf-divider-v" id="kf-div-1"></div>
            <div class="kf-row-left">
              <div class="kf-row-label" id="kf-label-1">Từ đỉnh 24/8 (~4.700 USD/ounce), giá vàng thế giới đã mất gần</div>

          </div>
          <div class="kf-row">
            <div class="kf-divider-v" id="kf-div-2"></div>
            <div class="kf-row-left">
              <div class="kf-row-pin" id="kf-pin-2"><svg viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-13A7 7 0 0 0 5 9c0 5.42 7 13 7 13Z" fill="#e8441e"/><circle cx="12" cy="9" r="2.6" fill="#111111"/></svg></div>
              <div class="kf-row-label" id="kf-label-2">Vàng miếng SJC (Mi Hồng): mua 143,8 — bán 145,3</div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#kf-map", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#kf-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.12);

          function row(i, t, hasPin) {
            tl.fromTo("#kf-div-" + i, { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, t);
            if (hasPin) {
              tl.fromTo("#kf-pin-" + i, { opacity: 0, scale: 0.5, y: -8 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t + 0.04);
            }
            tl.fromTo("#kf-label-" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t + 0.08);
            tl.fromTo("#kf-value-" + i, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, t + 0.16);
          }

          row(1, 0.5, false);
          row(2, 2.55, true);
          row(3, 4.75, true);

          window.__timelines["03-key-facts"] = tl;
        })();
      </script>
