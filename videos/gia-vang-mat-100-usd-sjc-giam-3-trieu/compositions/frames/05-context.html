        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #111111;
          font-family: "Montserrat", Arial, sans-serif;
          color: #ffffff;
        }

        .cx-kicker {
          position: absolute; left: 0; right: 0; top: 230px;
          text-align: center;
          font-weight: 700; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;
          color: rgba(255, 255, 255, 0.6);
          opacity: 0;
        }

        /* Map & Geo — Context: connection-line motif (this style's signature device) linking a
           central "vàng thế giới" node out to two cause-factor nodes — a network, not a literal
           VN map, since both factors are US/global market data, not domestic figures. */
        .cx-lines { position: absolute; inset: 0; }
        .cx-lines line { stroke: rgba(232, 68, 30, 0.55); stroke-width: 3; }

        .cx-center {
          position: absolute; left: 0; right: 0; top: 360px;
          display: flex; justify-content: center;
          opacity: 0;
        }
        .cx-center-badge {
          display: inline-flex; align-items: center; gap: 14px;
          padding: 22px 40px;
          border-radius: 100px;
          border: 2px solid #e8441e;
          background: rgba(232, 68, 30, 0.14);
        }
        .cx-center-badge span { font-weight: 800; font-size: 30px; letter-spacing: 0.02em; color: #ffffff; }
        .cx-center-arrow { font-weight: 900; font-size: 32px; color: #e8441e; }

        .cx-node {
          position: absolute; top: 700px;
          width: 430px;
          padding: 36px 32px;
          border-radius: 18px;
          border: 1.5px solid rgba(255, 255, 255, 0.16);
          background: rgba(255, 255, 255, 0.04);
          opacity: 0;
        }
        .cx-node-left { left: 64px; }
        .cx-node-right { right: 64px; }
        .cx-node-label {
          font-weight: 700; font-size: 21px; letter-spacing: 0.06em; text-transform: uppercase;
          color: rgba(255, 255, 255, 0.62);
          margin-bottom: 16px;
        }
        .cx-node-value {
          font-weight: 900; font-size: 54px; letter-spacing: -0.02em;
          color: #e8441e;
          font-variant-numeric: tabular-nums;
        }

        .cx-caption-wrap {
          position: absolute; left: 0; right: 0; top: 1000px;
          display: flex; justify-content: center;
          padding: 0 64px;
        }
        .cx-caption {
          text-align: center;
          font-weight: 600; font-size: 27px; line-height: 1.4;
          color: rgba(255, 255, 255, 0.78);
          max-width: 780px;
          opacity: 0;
        }
        .cx-caption .accent { color: #e8441e; font-weight: 800; }
      </style>

      <div id="root" data-composition-id="05-context" data-width="1080" data-height="1920">
        <svg class="cx-lines" viewBox="0 0 1080 1920" preserveAspectRatio="none">
          <line id="cx-line-left" x1="540" y1="470" x2="279" y2="700" />
          <line id="cx-line-right" x1="540" y1="470" x2="801" y2="700" />
        </svg>

        <div class="cx-kicker" id="cx-kicker">Tại sao giá vàng giảm</div>

        <div class="cx-center" id="cx-center">
          <div class="cx-center-badge">
            <span>Vàng thế giới</span><span class="cx-center-arrow">↓</span>
          </div>
        </div>

        <div class="cx-node cx-node-left" id="cx-node-left">
          <div class="cx-node-label">Chỉ số USD (DXY)</div>
          <div class="cx-node-value" id="cx-node-left-value">99,7</div>
          <div class="cx-node-label" style="margin: 10px 0 0 0;">điểm</div>
        </div>

        <div class="cx-node cx-node-right" id="cx-node-right">
          <div class="cx-node-label">Lợi suất trái phiếu Mỹ 10 năm</div>
          <div class="cx-node-value" id="cx-node-right-value">~4,79%</div>
        </div>

        <div class="cx-caption-wrap">
          <div class="cx-caption" id="cx-caption"><span class="accent">USD mạnh lên</span> + <span class="accent">lợi suất tăng</span> → vàng kém hấp dẫn hơn</div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          function drawLine(id, t) {
            var el = document.getElementById(id);
            var len = el.getTotalLength();
            el.style.strokeDasharray = len;
            el.style.strokeDashoffset = len;
            tl.to(el, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, t);
          }

          tl.fromTo("#cx-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.15);
          tl.fromTo("#cx-center", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.5);

          drawLine("cx-line-left", 1.15);
          tl.fromTo("#cx-node-left", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.35);

          drawLine("cx-line-right", 3.2);
          tl.fromTo("#cx-node-right", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.4);

          tl.fromTo("#cx-caption", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.4);

          window.__timelines["05-context"] = tl;
        })();
      </script>
    </template>
