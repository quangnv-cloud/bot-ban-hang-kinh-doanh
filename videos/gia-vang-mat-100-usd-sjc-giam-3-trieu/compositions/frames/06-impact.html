        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #111111;
          font-family: "Montserrat", Arial, sans-serif;
          color: #ffffff;

        /* Map & Geo — Impact (closing act): faint full-frame Việt Nam outline behind two geo cards
           ("thế giới" / "Việt Nam") sliding in from opposite sides — the style's canonical closer. */
        .im-map-wrap {
          position: absolute;
          left: 50%; top: 500px;
          width: 620px; height: 1000px;
          transform: translateX(-50%);
          opacity: 0;
        }
        .im-map-wrap svg { width: 100%; height: 100%; }
        .im-map-wrap path {
          fill: none;
          stroke: rgba(255, 255, 255, 0.1);
          stroke-width: 2.5;
        }

        .im-kicker {
          position: absolute; left: 0; right: 0; top: 280px;
          text-align: center;
          font-weight: 700; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;
          color: rgba(255, 255, 255, 0.6);
          opacity: 0;
        }

        .im-card {
          position: absolute; left: 64px; right: 64px;
          padding: 44px 40px;
          border-radius: 20px;
          border: 1.5px solid rgba(255, 255, 255, 0.16);
          background: rgba(17, 17, 17, 0.72);
          backdrop-filter: blur(2px);
        }
        .im-card-1 { top: 400px; opacity: 0; }
        .im-card-2 { top: 660px; opacity: 0; }

        .im-card-pin { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .im-card-pin svg { width: 22px; height: 22px; }
        .im-card-pin span {
          font-weight: 800; font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase;
          color: #ffffff;
        }

        .im-card-text {
          font-weight: 600; font-size: 27px; line-height: 1.4;
          color: rgba(255, 255, 255, 0.85);
          max-width: 780px;
        }

        .im-card-hero { display: flex; align-items: baseline; gap: 16px; }
        .im-card-value {
          font-weight: 900; font-size: 96px; line-height: 1; letter-spacing: -0.02em;
          color: #e8441e;
          font-variant-numeric: tabular-nums;
        }
        .im-card-unit { font-weight: 700; font-size: 26px; color: rgba(255, 255, 255, 0.7); }
