        .kf-ring-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .kf-ring-center span { font-weight: 800; font-size: 40px; color: #ffffff; }

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var C = 502.65; // 2*pi*80

          tl.fromTo("#kf-kicker", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.1);

          // Fact 1 — doanh thu bán điện, +14.3%
          tl.fromTo("#kf-row-1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);
          tl.fromTo("#kf-fill-1", { attr: { "stroke-dashoffset": C } }, { attr: { "stroke-dashoffset": C * (1 - 0.143) }, duration: 1.1, ease: "power2.inOut" }, 0.4);
          tl.to({ v: 0 }, {
            v: 14.3, duration: 1.1, ease: "power1.out",
            onUpdate: function () { document.getElementById("kf-pct-1").textContent = this.targets()[0].v.toFixed(1).replace(".", ",") + "%"; },

          // Fact 2 — tổng tài sản, +7.6%

          // Fact 3 — xóa sạch lỗ lũy kế (không phải %, ring vẽ đầy 100%)
