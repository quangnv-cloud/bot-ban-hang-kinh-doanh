        #root {
          position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden;
          font-family: "Montserrat", "Helvetica Neue", sans-serif; color: #ffffff; background: #111111;
          display: flex; align-items: center; justify-content: center;
        }

        .dm-kicker { position: absolute; top: 330px; left: 0; right: 0; text-align: center; opacity: 0; }
        .dm-kicker span { font-weight: 700; font-size: 27px; letter-spacing: 0.16em; text-transform: uppercase; color: #e8441e; }

        .dm-ring { position: relative; width: 780px; height: 780px; opacity: 0; margin-top: 40px; }
        .dm-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .dm-ring circle.track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 22; }
        .dm-ring circle.fill { fill: none; stroke: #e8441e; stroke-width: 22; stroke-linecap: round; }

        .dm-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .dm-pct { font-weight: 700; font-size: 34px; color: #e8441e; letter-spacing: 0.02em; margin-bottom: 6px; opacity: 0; }
        .dm-num { font-weight: 900; font-size: 108px; line-height: 1; color: #ffffff; letter-spacing: -0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .dm-unit { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; color: rgba(255,255,255,0.7); margin-top: 10px; }

        .dm-footnote {
          position: absolute; left: 88px; right: 88px; bottom: 300px; text-align: center; opacity: 0;
          font-weight: 500; font-size: 27px; line-height: 1.4; color: rgba(255,255,255,0.78);
        }
        .dm-footnote .hl { color: #e8441e; font-weight: 700; }

      <div id="root" data-composition-id="04-data-moment" data-width="1080" data-height="1920">
        <div class="dm-kicker"><span>Con số đáng chú ý</span></div>
        <div class="dm-ring">
          <svg viewBox="0 0 780 780">
            <circle class="track" cx="390" cy="390" r="350"></circle>
            <circle class="fill" id="dm-fill" cx="390" cy="390" r="350" stroke-dasharray="2199.11" stroke-dashoffset="2199.11"></circle>
          </svg>
          <div class="dm-center">
            <div class="dm-pct" id="dm-pct">0%</div>
            <div class="dm-num" id="dm-num">0</div>
            <div class="dm-unit">tỷ đồng gửi ngân hàng</div>
          </div>
        </div>
        <div class="dm-footnote">Chiếm hơn <span class="hl">42%</span> tổng danh mục đầu tư tài chính của tập đoàn</div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var C = 2199.11; // 2*pi*350
          var frac = 121835 / 288830; // 0.4218...

          tl.fromTo(".dm-kicker", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.1);
          tl.fromTo(".dm-ring", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 0.35);
          tl.fromTo("#dm-fill", { attr: { "stroke-dashoffset": C } }, { attr: { "stroke-dashoffset": C * (1 - frac) }, duration: 1.7, ease: "power2.inOut" }, 0.5);

          var counter = { v: 0, p: 0 };
          tl.to(counter, {
            v: 121835, p: frac * 100, duration: 1.7, ease: "power1.out",
            onUpdate: function () {
              document.getElementById("dm-num").textContent = Math.round(counter.v).toLocaleString("vi-VN");
              document.getElementById("dm-pct").textContent = counter.p.toFixed(1).replace(".", ",") + "%";
            },
          }, 0.5);
          tl.fromTo(".dm-pct", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);

          tl.fromTo(".dm-footnote", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.5);

          window.__timelines["04-data-moment"] = tl;
        })();
      </script>
