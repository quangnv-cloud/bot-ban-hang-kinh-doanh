          c.setAttribute("opacity", (0.15 + rand() * 0.25).toFixed(2));
          frag.appendChild(c);
        }
        svg.appendChild(frag);

        var tl = gsap.timeline({ paused: true });
        tl.to("#bg-depth .blob", { x: "+=40", y: "-=30", duration: 18, ease: "sine.inOut", repeat: -1, yoyo: true, stagger: 3 }, 0);
        tl.to("#bg-stars circle", { opacity: "+=0.25", duration: 4, ease: "sine.inOut", repeat: -1, yoyo: true, stagger: { each: 0.15, from: "random" } }, 0);

        tl.fromTo("#brand-anchor-logo", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 6.540);
        tl.fromTo("#brand-anchor-source", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 6.540);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
