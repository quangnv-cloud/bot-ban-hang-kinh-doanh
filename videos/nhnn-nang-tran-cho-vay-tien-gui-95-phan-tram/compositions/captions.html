            tl.set(groupEl, { opacity: 1 }, start);
            tl.set(groupEl, { opacity: 0 }, end);

            words.forEach(function (w, i) {
              var el = document.getElementById("cap-word-" + g + "-" + i);
              var at = Math.max(start, Number(w.start));
              tl.set(el, { className: "cap-word" }, start);
              tl.set(el, { className: "cap-word is-active" }, at);
              if (i + 1 < words.length) {
                var nextAt = Math.max(start, Number(words[i + 1].start));
                tl.set(el, { className: "cap-word is-spoken" }, nextAt);
              }
            });
            if (words.length) {
              var lastEl = document.getElementById("cap-word-" + g + "-" + (words.length - 1));
              var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
              tl.set(lastEl, { className: "cap-word is-spoken" }, lastSpoken);
            }
          });

          tl.to({}, { duration: DURATION }, 0);
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
