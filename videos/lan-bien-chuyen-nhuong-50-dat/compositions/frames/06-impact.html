        "#impact06-node-b",
        { scale: 0 },
        { scale: 1, duration: 0.15, ease: "back.out(2)" },
        LINE_B_START + LINE_B_DUR
      );

      // ---- Scene 6 (5.75–6.9s): card 2 "PHẢI TRIỂN KHAI" lands ----
      var CARD2_START = 5.75; // overlaps the reroute's tail
      tl.fromTo(
        ".impact06-card2",
        { opacity: 0, scale: 0.72, y: 26 },
        { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" },
        CARD2_START
      );
      tl.fromTo(
        ".impact06-card2 .impact06-card-border",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        CARD2_START
      );
      tl.fromTo(
        ".impact06-card2 .impact06-card-index",
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power1.out" },
        CARD2_START + 0.15
      );
      tl.fromTo(
        ".impact06-card2 .impact06-card-sub",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" },
        CARD2_START + 0.65
      );

      // ---- Scene 7 (7.2–10.0s): hold, single subtle collective jitter ----
      var group = q(".impact06-group");
      var IDLE_START = 7.2;
      var IDLE_DUR = 10.0 - IDLE_START;
      var CYCLES = 1.3;
      var SCALE_AMP = 0.01;
      var Y_AMP_PX = 2.5;
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            if (!group) return;
            var s = Math.sin(phase.p);
            group.style.transform =
              "translateY(" + (s * Y_AMP_PX).toFixed(2) + "px) scale(" +
              (1 + s * SCALE_AMP).toFixed(4) + ")";
          },
        },
        IDLE_START
      );
    })();
  </script>
</template>
