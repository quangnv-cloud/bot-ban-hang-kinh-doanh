      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111111;
        font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
      }

      /* ── Depth background (mounted once at root, behind every scene) ───────────
         2-3 slow-drifting brand-orange blobs + a seeded-PRNG star field. Not a
         particle explosion — a quiet sense of space instead of a flat dead plate. */
      #bg-depth { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
      #bg-depth .blob { position: absolute; border-radius: 50%; filter: blur(60px); }
      #bg-blob-1 { width: 640px; height: 640px; background: radial-gradient(circle, rgba(232,68,30,0.20), transparent 70%); top: -120px; left: -160px; }
      #bg-blob-2 { width: 560px; height: 560px; background: radial-gradient(circle, rgba(232,68,30,0.14), transparent 70%); top: 900px; right: -200px; }
      #bg-blob-3 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(232,68,30,0.12), transparent 70%); bottom: -180px; left: 200px; }
      #bg-stars { position: absolute; inset: 0; width: 100%; height: 100%; }

      .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }

      /* ── Caption karaoke layer (synced to the ElevenLabs word timestamps) ──────
         Sits clear of the platform bottom safe zone (~11-17% = below y 1594) and
         clear of the right-hand icon column (right edge 880px). */
      #cap-layer { position: absolute; left: 64px; top: 1468px; width: 816px; height: 120px; z-index: 80; }
      #cap-layer .cap-chunk {
        position: absolute;
        left: 0; top: 0; width: 816px;
        font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 37px;
        line-height: 1.26;
        letter-spacing: -0.005em;
        opacity: 0;
      }
      #cap-layer .w {
        display: inline-block;
        margin-right: 0.26em;
        color: rgba(255, 255, 255, 0.55);
      }

      /* ── Fixed Brand Anchor — logo TOP-RIGHT, source TOP-LEFT, from end-of-Hook

      #brand-anchor-logo { position: absolute; right: 48px; top: 48px; width: 108px; height: 117px; z-index: 90; }
      #brand-anchor-logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
      #brand-anchor-source {
        position: absolute; left: 48px; top: 48px; z-index: 90;

              { color: "#e8441e", duration: 0.1, ease: "none" },
              ws[m][1]
            );
          }
          tl.to(chunkEls[k], { opacity: 0, duration: 0.1, ease: "power1.in" }, outAt);
        }

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
