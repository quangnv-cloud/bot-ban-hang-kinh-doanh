          for (var wi = 0; wi < words.length; wi++) {
            var sp = document.createElement("span");
            sp.className = "w";
            sp.id = "cap-c" + ci + "-w" + wi;
            sp.textContent = words[wi][0];
            chunk.appendChild(sp);
            refs.push(sp);
          }
          capLayer.appendChild(chunk);
          chunkEls.push(chunk);
          wordEls.push(refs);
        }

        var tl = gsap.timeline({ paused: true });

        // Depth motion. Finite repeat counts so the timeline stays bounded and
        // deterministic for a seek-based renderer; cycles cover the full 49.6s runtime.
        tl.to("#bg-depth .blob", { x: "+=40", y: "-=30", duration: 16, ease: "sine.inOut", repeat: 3, yoyo: true, stagger: 3 }, 0);
        tl.to("#bg-stars circle", { opacity: "+=0.25", duration: 4, ease: "sine.inOut", repeat: 11, yoyo: true, stagger: { each: 0.15, from: "random" } }, 0);

        // Caption chunks: fade in, karaoke each word to brand orange at the exact
        // moment it is spoken, fade the chunk out at its end. Skipped during Hook
        // (0 - 5.6s) per brand rule -- Hook title-card already shows the headline.
        for (var k = 0; k < CAPS.length; k++) {
          var cs = CAPS[k][0], ce = CAPS[k][1], ws = CAPS[k][2];
          var nextIn = (k + 1 < CAPS.length) ? CAPS[k + 1][0] - 0.06 : Infinity;
          var outAt = Math.min(ce, nextIn - 0.12);
          tl.fromTo(chunkEls[k], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, Math.max(0, cs - 0.06));
          for (var m = 0; m < ws.length; m++) {
            tl.fromTo(
              wordEls[k][m],
              { color: "rgba(255,255,255,0.55)" },
              { color: "#e8441e", duration: 0.1, ease: "none" },
              ws[m][1]
            );
          }
          tl.to(chunkEls[k], { opacity: 0, duration: 0.1, ease: "power1.in" }, outAt);
        }

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
