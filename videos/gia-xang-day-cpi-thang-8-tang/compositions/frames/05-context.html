      <script>
        (function () {
          // Ring r=88: circumference 2*pi*88 = 552.92.
          // SCALE (Context): trần dùng chung 10% cho cả 4 ring (tăng lẫn giảm) để phản ánh đúng
          // tương quan độ lớn TUYỆT ĐỐI giữa các mức biến động trong act này — đường sắt (-9,86%)
          // gần chạm trần vì đây là biến động tuyệt đối lớn nhất trong nhóm, ô tô cũ (-0,63%) chỉ
          // vẽ một cung nhỏ vì biến động nhỏ nhất. fraction = |value| / 10 ; offset = C * (1 - fraction).
          var RING_C = 552.92;
          var items = [
            { ringId: "ctx-ring-1", valId: "ctx-value-1", colId: "ctx-col-1", value: 4.19, sign: "up", offset: 321.25, start: 0.7 },
            { ringId: "ctx-ring-2", valId: "ctx-value-2", colId: "ctx-col-2", value: 4.63, sign: "up", offset: 296.92, start: 3.4 },
            { ringId: "ctx-ring-3", valId: "ctx-value-3", colId: "ctx-col-3", value: 0.63, sign: "down", offset: 518.09, start: 6.3 },
            { ringId: "ctx-ring-4", valId: "ctx-value-4", colId: "ctx-col-4", value: 9.86, sign: "down", offset: 7.74, start: 9.0 },
          ];

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#ctx-kicker", { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power2.out" }, 0);
          tl.fromTo("#ctx-title", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 0.16);

          items.forEach(function (it) {
            tl.fromTo(
              "#" + it.colId,
              { opacity: 0, y: 20 },
              { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
              it.start,
            );

            tl.fromTo(
              "#" + it.ringId,
              { strokeDashoffset: RING_C },
              { strokeDashoffset: it.offset, duration: 0.9, ease: "power2.inOut" },
              it.start + 0.05,
            );

            var counter = { v: 0 };
            var elId = it.valId;
            var sign = it.sign;
            tl.to(
              counter,
              {
                v: it.value,
                duration: 0.9,
                ease: "power2.inOut",
                onUpdate: function () {
                  var el = document.getElementById(elId);
                  if (!el) return;
                  var txt = counter.v.toFixed(2).replace(".", ",") + "%";
                  el.textContent = sign === "up" ? "▲ +" + txt : "▼ -" + txt;
                },
              },
              it.start + 0.05,
            );
          });

          tl.fromTo("#ctx-caption", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" }, 11.1);

          window.__timelines["05-context"] = tl;
        })();
      </script>
