          color: #ffffff;

          color: rgba(255, 255, 255, 0.6);
        }

        .dm-ring-box { position: absolute; left: 190px; top: 380px; width: 700px; height: 700px; }
        .dm-ring-box svg { width: 100%; height: 100%; overflow: visible; }
        .dm-ring-track { fill: none; stroke: rgba(255, 255, 255, 0.09); stroke-width: 34; }
        .dm-ring-fill { fill: none; stroke: #e8441e; stroke-width: 34; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 350px 350px; }

        .dm-center {
          position: absolute; left: 270px; width: 540px; top: 588px; text-align: center;
        }
        .dm-center-label {
          font-weight: 600; font-size: 24px; letter-spacing: 0.05em; text-transform: uppercase;
          color: rgba(255, 255, 255, 0.62); margin-bottom: 20px;
        }
        .dm-center-number {
          display: inline-block;
          /* Hardcoded (not fitTextFontSize — see script comment): 118px keeps "22,15%" clear

          font-weight: 900; font-size: 118px; letter-spacing: -0.02em; line-height: 1; color: #e8441e;
          font-variant-numeric: tabular-nums;

        .dm-center-sub {

          color: rgba(255, 255, 255, 0.8);

      <script>
        (function () {
          // Ring r=300: circumference 2*pi*300 = 1884.96.
          // SCALE (Data moment): trần hiển thị 25% (không phải 100%) — 22,15% (dầu diesel) là
          // mức tăng giá lớn nhất trong toàn bộ câu chuyện; chọn trần hơi cao hơn giá trị thực để
          // vòng gần đầy (đúng vai trò "hero ring" — điểm nhấn số liệu quan trọng nhất) nhưng
          // không chạm mốc 100% tuyệt đối, tránh ngộ nhận "đã hoàn tất/đạt trần".
          // fraction = 22.15 / 25 = 0.886 ; offset = 1884.96 * (1 - 0.886) = 214.89.
          var RING_C = 1884.96;
          var RING_OFFSET = 214.89;
          var TARGET = 22.15;

          // Hero number font-size is hardcoded in CSS (not fitTextFontSize — see BRAND-SYSTEM
          // "bài học kỹ thuật": the fit helper under-measured this exact bold/tracked numeral
          // case, verified by a real render frame where the returned size still crossed the
          // ring stroke). 118px confirmed clear via a fresh Studio thumbnail re-check below.

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#dm-eyebrow", { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
          tl.fromTo("#dm-ring-box", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power2.out" }, 0.16);
          tl.fromTo("#dm-center-label", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);

          tl.fromTo(
            "#dm-ring-fill",
            { strokeDashoffset: RING_C },
            { strokeDashoffset: RING_OFFSET, duration: 1.55, ease: "power2.inOut" },
            0.55,
          );

          var counter = { v: 0 };
          tl.to(
            counter,
            {
              v: TARGET,
              duration: 1.55,
              ease: "power2.inOut",
              onUpdate: function () {
                document.getElementById("dm-center-number").textContent = counter.v.toFixed(2).replace(".", ",") + "%";
              },
            },
            0.55,
          );

          tl.fromTo("#dm-center-sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, 2.25);

          tl.fromTo(
            "#dm-side-tag",
            { scale: 0.7, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.2)" },
            2.45,
          );

          tl.fromTo("#dm-caption", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" }, 2.85);

          window.__timelines["04-data-moment"] = tl;
        })();
      </script>
