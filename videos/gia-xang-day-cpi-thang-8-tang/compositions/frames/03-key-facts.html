      <script>
        (function () {
          // Mini ring r=36: circumference 2*pi*36 = 226.19.
          // SCALE (Key facts): các % trong act này đều nhỏ (<5%) — nếu vẽ đúng tỉ lệ tuyệt đối
          // trên thang 0-100%, mọi vòng sẽ gần như rỗng, khó đọc trong ~1-2s trên khung nhỏ.
          // Dùng trần hiển thị 5,5% = "gần đầy vòng" (không phải 100%), nhất quán cho cả 3 ring
          // trong act này, để vẫn giữ đúng tương quan lớn/nhỏ giữa 3,57% / 4,89% / 4,09%.
          // fraction = value / 5.5 ; offset = C * (1 - fraction).
          var RING_C = 226.19;
          var facts = [
            { ringId: "kf-ring-1", valId: "kf-value-1", value: 3.57, offset: 79.37, start: 0.5 },
            { ringId: "kf-ring-2", valId: "kf-value-2", value: 4.89, offset: 25.09, start: 3.7 },
            { ringId: "kf-ring-3", valId: "kf-value-3", value: 4.09, offset: 57.99, start: 6.9 },
          ];

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#kf-kicker", { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power2.out" }, 0);
          tl.fromTo("#kf-title", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 0.16);

          facts.forEach(function (f) {
            tl.fromTo(
              "#" + f.ringId,
              { strokeDashoffset: RING_C },
              { strokeDashoffset: f.offset, duration: 0.95, ease: "power2.inOut" },
              f.start,
            );

            var counter = { v: 0 };
            var elId = f.valId;
            tl.to(
              counter,
              {
                v: f.value,
                duration: 0.95,
                ease: "power2.inOut",
                onUpdate: function () {
                  var el = document.getElementById(elId);
                  if (el) el.textContent = "▲ +" + counter.v.toFixed(2).replace(".", ",") + "%";
                },
              },
              f.start,
            );

            var rowId = f.ringId === "kf-ring-1" ? "#kf-row-1" : f.ringId === "kf-ring-2" ? "#kf-row-2" : "#kf-row-3";
            tl.fromTo(rowId, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, f.start - 0.1);
          });

          tl.fromTo(
            "#kf-card",
            { opacity: 0, y: 24, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
            10.1,
          );

          window.__timelines["03-key-facts"] = tl;
        })();
      </script>
