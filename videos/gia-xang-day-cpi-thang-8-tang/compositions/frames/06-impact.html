        (function () {
          // Ring r=190: circumference 2*pi*190 = 1193.81.
          // SCALE (Impact): dùng đúng % TUYỆT ĐỐI (fraction = value/100, KHÔNG scale/trần) vì
          // 4,45% và 3,25% cùng đơn vị/thang, cần so sánh trực tiếp đúng tỷ lệ tự nhiên với nhau
          // (theo đúng lưu ý thiết kế trong SCRIPT.md cho act Impact).
          var RING_C = 1193.81;

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#im-kicker", { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power2.out" }, 0);
          tl.fromTo("#im-title", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 0.16);

          tl.fromTo("#im-col-left", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.6);
          tl.fromTo(
            "#im-ring-left",
            { strokeDashoffset: RING_C },
            { strokeDashoffset: 1140.69, duration: 1.1, ease: "power2.inOut" },
            0.7,
          );
          (function () {
            var counter = { v: 0 };
            tl.to(
              counter,
              {
                v: 4.45,
                duration: 1.1,
                ease: "power2.inOut",
                onUpdate: function () {
                  document.getElementById("im-number-left").textContent = counter.v.toFixed(2).replace(".", ",") + "%";
                },
              },
              0.7,
            );
          })();

          tl.fromTo("#im-col-right", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 3.2);
          tl.fromTo(
            "#im-ring-right",
            { strokeDashoffset: RING_C },
            { strokeDashoffset: 1155.01, duration: 1.1, ease: "power2.inOut" },
            3.3,
          );
          (function () {
            var counter2 = { v: 0 };
            tl.to(
              counter2,
              {
                v: 3.25,
                duration: 1.1,
                ease: "power2.inOut",
                onUpdate: function () {
                  document.getElementById("im-number-right").textContent = counter2.v.toFixed(2).replace(".", ",") + "%";
                },
              },
              3.3,
            );
          })();
