      <script>
        (function () {
          function formatVN(n) {
            var s = Math.round(n).toString();
            var out = "";
            var count = 0;
            for (var i = s.length - 1; i >= 0; i--) {
              out = s.charAt(i) + out;
              count++;
              if (count % 3 === 0 && i !== 0) out = "." + out;
            }
            return out;
          }

          var num1 = document.getElementById("im-number-1");
          var num2 = document.getElementById("im-number-2");
          var c1 = { val: 0 };
          var c2 = { val: 0 };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#im-kicker", { y: -12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

          // Card 1 — Bảo Việt Nhân thọ, timed to the first pop SFX cue.
          tl.fromTo("#im-card-1", { y: 30, opacity: 0, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 1.3);
          tl.to(c1, { val: 6440, duration: 0.7, ease: "power2.out", onUpdate: function () { num1.textContent = formatVN(c1.val); } }, 1.3);
          tl.fromTo("#im-meter-1", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 1.55);

          // Card 2 — Prudential, timed to the second pop SFX cue.
          tl.fromTo("#im-card-2", { y: 30, opacity: 0, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 4.7);
          tl.to(c2, { val: 3440, duration: 0.7, ease: "power2.out", onUpdate: function () { num2.textContent = formatVN(c2.val); } }, 4.7);
          tl.fromTo("#im-meter-2", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 4.95);

          // Final emphasis beat timed to the closing chime SFX cue — one finite
          // keyframed pulse per hero number (individual tweens, not a shared-
          // keyframes group selector), not a loop.
          tl.to(
            "#im-number-1",
            { keyframes: [{ scale: 1.06, duration: 0.32 }, { scale: 1, duration: 0.32 }], ease: "power1.inOut" },
            11.3,
          );
          tl.to(
            "#im-number-2",
            { keyframes: [{ scale: 1.06, duration: 0.32 }, { scale: 1, duration: 0.32 }], ease: "power1.inOut" },
            11.3,
          );

          window.__timelines["06-impact"] = tl;
        })();
