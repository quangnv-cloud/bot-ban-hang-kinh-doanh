        #root {

          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }

        .dm-kicker {
          font-weight: 700;

          letter-spacing: 0.16em;

          color: #e8441e;
          margin-bottom: 28px;
          opacity: 0;
          text-align: center;
          max-width: 820px;
        }

        .dm-number-row { display: flex; align-items: baseline; justify-content: center; }
        .dm-number {
          display: inline-block;
          font-weight: 900;
          letter-spacing: -0.03em;
          line-height: 0.88;
          color: #e8441e;
          font-size: 220px;
          font-variant-numeric: tabular-nums;
          transform-origin: center center;
        }
        .dm-number-suffix {
          display: inline-block;
          font-weight: 900;
          font-size: 100px;
          color: #e8441e;
          opacity: 0;
          margin-left: 4px;
        }

        .dm-sub {
          margin-top: 30px;
          font-weight: 600;
          font-size: 30px;
          line-height: 1.35;
          color: rgba(255, 255, 255, 0.86);
          text-align: center;
          max-width: 880px;
          opacity: 0;
        }
        .dm-sub .accent { color: #e8441e; font-weight: 700; }

        .dm-paradox {
          margin-top: 34px;
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 16px 28px;
          border-radius: 100px;
          border: 1.5px solid rgba(255, 255, 255, 0.26);
          background: rgba(255, 255, 255, 0.04);
          opacity: 0;

        .dm-paradox span { font-weight: 700; font-size: 24px; }
        .dm-paradox .up { color: #e8441e; }
        .dm-paradox .sep { color: rgba(255, 255, 255, 0.4); font-weight: 500; }
        .dm-paradox .down { color: rgba(255, 255, 255, 0.86); font-weight: 500; }

      <script>
        (function () {
          var numberEl = document.getElementById("dm-number");
          var counter = { val: 0 };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#dm-kicker", { y: -12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

          tl.fromTo(
            "#dm-number",
            { scale: 0.9, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" },
            0.2,
          );
          tl.to(
            counter,
            {
              val: 17,
              duration: 0.8,
              ease: "power2.out",
              onUpdate: function () {
                numberEl.textContent = Math.round(counter.val);
              },
            },
            0.2,
          );
          tl.fromTo(
            "#dm-number-suffix",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.28, ease: "back.out(2)" },
            1.0,
          );

          tl.fromTo("#dm-sub", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, 1.35);
          tl.fromTo("#dm-paradox", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 1.75);

          tl.fromTo("#dm-bars", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 2.15);
          tl.fromTo("#dm-bar-before", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, 2.15);
          tl.fromTo("#dm-bar-after", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, 2.3);

          window.__timelines["04-data-moment"] = tl;
        })();
