    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="05-budget-impact"]');
        var camera = root.querySelector("#fr05-camera");
        var eyebrow = root.querySelector(".fr05-eyebrow-wrap");
        var tag1 = root.querySelector("#fr05-tag1");
        var counter1 = root.querySelector("#fr05-counter1");
        var suffix1 = root.querySelector("#fr05-suffix1");
        var tag2 = root.querySelector("#fr05-tag2");
        var counter2 = root.querySelector("#fr05-counter2");
        var suffix2 = root.querySelector("#fr05-suffix2");

        var TOTAL_DURATION = 5.248;

        var tl = gsap.timeline({ paused: true });

        /* ---------- Scene 1 (0.0-2.3s): eyebrow, then stat 1 counts up ---------- */
        tl.fromTo(
          eyebrow,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          0,
        );

        tl.from(tag1, { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, 0.25);

        (function () {
          var state1 = { value: 0 };
          var TARGET1 = 3191;
          var COUNT1_AT = 0.4;
          var COUNT1_DUR = 1.5;
          var COUNT1_EASE = "power3.out";
          var START_SCALE1 = 0.55;

          tl.to(
            state1,
            {
              value: TARGET1,
              duration: COUNT1_DUR,
              ease: COUNT1_EASE,
              onUpdate: function () {
                counter1.textContent = Math.round(state1.value).toLocaleString("vi-VN");
              },
            },
            COUNT1_AT,
          );

          tl.fromTo(
            counter1,
            { scale: START_SCALE1 },
            { scale: 1, duration: COUNT1_DUR, ease: COUNT1_EASE },
            COUNT1_AT,
          );

          tl.to(
            suffix1,
            { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
            COUNT1_AT + COUNT1_DUR,
          );
        })();

        /* ---------- Scene 2 (2.3-4.2s): stat 2 counts up + single camera push ---------- */
        tl.from(tag2, { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, 2.3);

        (function () {
          var state2 = { value: 0 };
          var TARGET2 = 3510;
          var COUNT2_AT = 2.35;
          var COUNT2_DUR = 1.4;
          var COUNT2_EASE = "power3.out";
          var START_SCALE2 = 0.55;

          tl.to(
            state2,
            {
              value: TARGET2,
              duration: COUNT2_DUR,
              ease: COUNT2_EASE,
              onUpdate: function () {
                counter2.textContent = Math.round(state2.value).toLocaleString("vi-VN");
              },
            },
            COUNT2_AT,
          );

          tl.fromTo(
            counter2,
            { scale: START_SCALE2 },
            { scale: 1, duration: COUNT2_DUR, ease: COUNT2_EASE },
            COUNT2_AT,
          );

          tl.to(
            suffix2,
            { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
            COUNT2_AT + COUNT2_DUR,
          );
        })();

        /* ---------- Camera: one push (multi-phase-camera) connecting stat 1 -> stat 2,
           then continuous micro-drift only (Scene 3's "subtle jitter") ---------- */
        var phase = { scale: 1.0 };
        var pan = { y: 0 };
        var PHASE2_AT = 2.3;
        var PHASE2_DUR = 1.3;
        var PHASE2_EASE = "power2.out";

        tl.to(phase, { scale: 1.12, duration: PHASE2_DUR, ease: PHASE2_EASE }, PHASE2_AT);
        tl.to(pan, { y: -28, duration: PHASE2_DUR, ease: PHASE2_EASE }, PHASE2_AT);

        var DRIFT_AMP_X = 4;
        var DRIFT_AMP_Y = 2;
        var DRIFT_FREQ_RATIO = 1.3;
        var DRIFT_CYCLES = 2;
        var drift = { p: 0 };

        tl.to(
          drift,
          {
            p: Math.PI * 2 * DRIFT_CYCLES,
            duration: TOTAL_DURATION,
            ease: "none",
            onUpdate: function () {
              var dx = Math.sin(drift.p) * DRIFT_AMP_X;
              var dy = Math.sin(drift.p * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y + pan.y;
              camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
            },
          },
          0,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["05-budget-impact"] = tl;
      })();
