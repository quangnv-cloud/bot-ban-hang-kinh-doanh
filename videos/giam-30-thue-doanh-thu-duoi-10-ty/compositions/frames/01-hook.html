  <script>
    window.__timelines = window.__timelines || {};

    const root = document.currentScript.previousElementSibling;
    const camera = root.querySelector(".f01hook-camera");
    const bg = root.querySelector(".f01hook-bg");
    const counterEl = root.querySelector(".f01hook-counter");
    const suffixEl = root.querySelector(".f01hook-suffix");
    const counterWrap = root.querySelector(".f01hook-counter-wrap");
    const words = root.querySelectorAll(".f01hook-word");
    const line2 = root.querySelector(".f01hook-line2");

    const tl = gsap.timeline({ paused: true });

    const COUNT_DUR = 0.6; // Scene 1 (0.0-0.7s): value-scaled counter locks on the VO's "30%"
    const START_SIZE = 170;
    const END_SIZE = 340;
    const START_SCALE = START_SIZE / END_SIZE;

    // Atmosphere settles first — cream ground + faint cobalt dot-grid, stable before the burst.
    tl.fromTo(bg, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, 0);

    // counting-dynamic-scale: count 0 -> 30 while transform scale grows to the locked size.
    const counterState = { value: 0 };
    tl.to(
      counterState,
      {
        value: 30,
        duration: COUNT_DUR,
        ease: "power3.out",
        onUpdate: () => {
          counterEl.textContent = String(Math.round(counterState.value));
        },
      },
      0,
    );
    tl.fromTo(
      counterEl,
      { scale: START_SCALE },
      { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
      0,
    );

    // Suffix "%" gets its own beat after the count lands.
    tl.fromTo(
      suffixEl,
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
      COUNT_DUR,
    );

    // Scene 2 (0.7-2.4s): per-word staggered reveal — "thuế sắp được cắt giảm" arrives beneath.
    tl.fromTo(
      words,
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.32, ease: "power2.out", stagger: 0.12 },
      0.95,
    );

    // Subtle continuous jitter on the locked numeral — deterministic sine-timed drift, no CSS animation.
    tl.to(
      counterWrap,
      { y: "+=4", duration: 0.34, ease: "sine.inOut", yoyo: true, repeat: 7 },
      1.0,
    );

    // Scene 3 (2.4-3.669s): hard-cut word reveal on the VO's rhetorical question — instant, no tween smear.
    tl.set(line2, { opacity: 1 }, 2.4);

    // Hook blueprint's signature close: a slow continuous camera lean-in across the whole shot.
    tl.fromTo(camera, { scale: 1 }, { scale: 1.035, duration: 3.669, ease: "none" }, 0);

    window.__timelines["01-hook"] = tl;
