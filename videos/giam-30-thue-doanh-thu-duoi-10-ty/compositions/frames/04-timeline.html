    (function () {
      var COMP_ID = "04-timeline";
      var root = document.querySelector(

      // Setup — measure the real path length before any tween touches it.
      var line = root.querySelector("#fw4-tl-line");
      var lineLen = line.getTotalLength();
      line.style.strokeDasharray = String(lineLen);
      line.style.strokeDashoffset = String(lineLen);

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–2.3s): full-bleed photo push-in, decelerating, then a
      // static hold — same grammar as Frame 2. Scrim darkens the lower area
      // to prep room for the timeline graphic. No graphics yet.
      tl.fromTo(
        root.querySelector(".fw4-bg-photo"),
        { scale: 1.0, opacity: 0 },
        { scale: 1.06, opacity: 1, duration: 1.6, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        root.querySelector(".fw4-scrim"),
        { opacity: 0 },
        { opacity: 1, duration: 1.0, ease: "power1.out" },
        0.2,
      );

      // Scene 2 (2.3–5.5s): cobalt timeline self-draws left→right as VO says
      // "2026, 2027"; each year lands via a per-word staggered reveal timed
      // to its own cue.
      tl.to(
        line,
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        2.3,
      );
      tl.fromTo(
        root.querySelector("#fw4-arrowhead"),
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
        3.05,

      tl.fromTo(
        root.querySelector("#fw4-year-2026"),
        { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        2.5,
      );
      tl.fromTo(
        root.querySelector("#fw4-year-2027"),
        { opacity: 0, x: 18 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        3.5,
      );

      // left is one finite jitter beat on the badge (no loop, no repeat).

        root.querySelector("#fw4-badge"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        5.6,
