<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute; inset: 0; width: 100%; height: 100%;
          overflow: hidden; font-family: "Montserrat", sans-serif; color: #ffffff; background: #111111;
        }

        .s5-kicker { position: absolute; left: 60px; right: 60px; top: 300px; display: flex; align-items: center; gap: 12px; opacity: 0; }
        .s5-kicker-bar { width: 34px; height: 4px; background: #e8441e; border-radius: 2px; }
        .s5-kicker span { font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: #e8441e; }

        .s5-chart { position: absolute; left: 60px; right: 60px; top: 420px; display: flex; align-items: flex-end; justify-content: center; gap: 90px; height: 640px; }

        .s5-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .s5-col-value { font-weight: 800; font-size: 46px; color: #e8441e; margin-bottom: 16px; white-space: nowrap; opacity: 0; }
        .s5-col-track { width: 130px; height: 420px; border-radius: 16px 16px 6px 6px; background: rgba(255,255,255,0.07); position: relative; overflow: hidden; }
        .s5-col-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: #e8441e; border-radius: 16px 16px 6px 6px; }
        .s5-col-label { font-weight: 600; font-size: 27px; line-height: 1.3; color: #ffffff; text-align: center; margin-top: 22px; max-width: 220px; opacity: 0; }

        .s5-quote { position: absolute; left: 60px; right: 60px; top: 1330px; padding: 34px 38px; border-radius: 18px; border-left: 4px solid #e8441e; background: rgba(255,255,255,0.04); opacity: 0; }
        .s5-quote-mark { font-weight: 800; font-size: 60px; line-height: 1; color: #e8441e; opacity: 0.85; margin-bottom: 4px; }
        .s5-quote-text { font-weight: 500; font-size: 30px; line-height: 1.42; color: #ffffff; max-width: 900px; }
        .s5-quote-attr { font-weight: 700; font-size: 22px; letter-spacing: 0.03em; color: rgba(255,255,255,0.6); margin-top: 16px; }
      </style>

      <div id="root" data-composition-id="05-context" data-width="1080" data-height="1920">
        <div class="s5-kicker">
          <div class="s5-kicker-bar"></div>
          <span>Vì sao giá tăng</span>
        </div>

        <div class="s5-chart">
          <div class="s5-col">
            <div class="s5-col-value" id="s5-val-1">+60%</div>
            <div class="s5-col-track"><div class="s5-col-fill" id="s5-fill-1"></div></div>
            <div class="s5-col-label">Brent, từ đầu năm 2026</div>
          </div>
          <div class="s5-col">
            <div class="s5-col-value" id="s5-val-2">&asymp;200 USD/thùng</div>
            <div class="s5-col-track"><div class="s5-col-fill" id="s5-fill-2"></div></div>
            <div class="s5-col-label">Diesel chuẩn tại châu Âu</div>
          </div>
        </div>

        <div class="s5-quote">
          <div class="s5-quote-mark">&ldquo;</div>
          <div class="s5-quote-text">Nguồn cung dầu toàn cầu tiếp tục bị gián đoạn.</div>
          <div class="s5-quote-attr">Goldman Sachs &middot; Vitol Group</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo('.s5-kicker', { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.32, ease: 'power2.out' }, 0);

        tl.fromTo('#s5-fill-1', { height: '0%' }, { height: '58%', duration: 0.9, ease: 'power2.out' }, 0.45);
        tl.fromTo('#s5-val-1', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 1.0);
        tl.fromTo('.s5-col:nth-child(1) .s5-col-label', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 1.15);

        tl.fromTo('#s5-fill-2', { height: '0%' }, { height: '92%', duration: 0.9, ease: 'power2.out' }, 0.85);
        tl.fromTo('#s5-val-2', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 1.4);
        tl.fromTo('.s5-col:nth-child(2) .s5-col-label', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 1.55);

        tl.fromTo('.s5-quote', { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.1);

        window.__timelines['05-context'] = tl;
      </script>
    </template>
  </body>
</html>
