<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute; inset: 0; width: 100%; height: 100%;
          overflow: hidden; font-family: "Montserrat", sans-serif; color: #ffffff; background: #111111;
        }

        .s1-photo { position: absolute; left: 0; right: 0; top: 0; height: 936px; overflow: hidden; background: #0a0a0a; opacity: 0; }
        .s1-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; }
        .s1-scrim {
          position: absolute; inset: 0;
          background: linear-gradient(180deg, rgba(17,17,17,0.08) 0%, rgba(17,17,17,0.28) 52%, rgba(17,17,17,0.98) 100%);
        }

        .s1-panel {
          position: absolute; left: 0; right: 0; top: 896px; bottom: 0;
          background: #111111; padding: 72px 60px 104px;
          display: flex; flex-direction: column; align-items: flex-start;
        }

        .s1-masthead { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; opacity: 0; }
        .s1-masthead-logo { width: 44px; height: 44px; flex: none; }
        .s1-masthead-logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .s1-masthead-word { font-weight: 700; font-size: 28px; line-height: 1; color: #ffffff; }

        .s1-badge {
          display: inline-flex; align-items: center; gap: 10px;
          padding: 11px 20px; border-radius: 8px;
          border: 1.5px solid rgba(232, 68, 30, 0.85);
          background: rgba(232, 68, 30, 0.1);
          margin-bottom: 34px; opacity: 0;
        }
        .s1-badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #e8441e; flex: none; }
        .s1-badge span { font-weight: 500; font-size: 21px; letter-spacing: 0.02em; color: #ffffff; white-space: nowrap; }

        .s1-headline { opacity: 0; }
        .s1-kicker { font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: #e8441e; margin-bottom: 14px; }
        .s1-num-row { display: flex; align-items: baseline; gap: 16px; }
        .s1-num { font-weight: 800; font-size: 148px; line-height: 1; color: #e8441e; letter-spacing: -0.01em; white-space: nowrap; }
        .s1-unit { font-weight: 700; font-size: 30px; letter-spacing: 0.02em; color: #ffffff; white-space: nowrap; }
        .s1-sub { font-weight: 600; font-size: 38px; line-height: 1.3; color: #ffffff; margin-top: 26px; max-width: 940px; }
      </style>

      <div id="root" data-composition-id="01-hook" data-width="1080" data-height="1920">
        <div class="s1-photo">
          <img src="assets/images/hook-photo.jpg" alt="">
          <div class="s1-scrim"></div>
        </div>

        <div class="s1-panel">
          <div class="s1-masthead">
            <div class="s1-masthead-logo"><img src="public/logo-bbh-mark.png" alt=""></div>
            <div class="s1-masthead-word">Bot Bán Hàng</div>
          </div>

          <div class="s1-badge">
            <div class="s1-badge-dot"></div>
            <span>Nguồn: Dân Trí &middot; 8/9/2026</span>
          </div>

          <div class="s1-headline">
            <div class="s1-kicker">Giá dầu Brent</div>
            <div class="s1-num-row">
              <div class="s1-num" id="s1-num">0</div>
              <div class="s1-unit">USD/thùng</div>
            </div>
            <div class="s1-sub">Houthi tấn công cơ sở năng lượng ở miền Nam Ả Rập Xê Út</div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const root = document.querySelector('[data-composition-id="01-hook"]');
        const numEl = root.querySelector('#s1-num');
        const counter = { v: 0 };

        tl.fromTo('.s1-photo', { autoAlpha: 0.7, scale: 1.08 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: 'power2.out' }, 0);
        tl.fromTo('.s1-panel', { y: 44 }, { y: 0, duration: 0.5, ease: 'power2.out' }, 0.15);
        tl.fromTo('.s1-masthead', { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.35);
        tl.fromTo('.s1-badge', { autoAlpha: 0, scale: 0.92 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, 0.58);
        tl.fromTo('.s1-headline', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.1 }, 0.9);
        tl.fromTo('.s1-kicker', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.9);
        tl.fromTo(counter, { v: 0 }, {
          v: 100, duration: 0.9, ease: 'power1.out',
          onUpdate() { numEl.textContent = Math.round(counter.v).toString(); }
        }, 1.05);
        tl.fromTo('.s1-unit', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 1.75);
        tl.fromTo('.s1-sub', { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 2.05);

        window.__timelines['01-hook'] = tl;
      </script>
    </template>
  </body>
</html>
