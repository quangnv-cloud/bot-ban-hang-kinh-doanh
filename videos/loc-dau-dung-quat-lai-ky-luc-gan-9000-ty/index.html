    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Seeded PRNG for background stars — deterministic, unique per video.
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(20261102097);
      var starsSvg = document.getElementById("bg-stars");
      var starEls = [];
      for (var i = 0; i < 40; i++) {
        var cx = rand() * 1080;
        var cy = rand() * 1920;
        var r = 1.5 + rand() * 1.5;
        var baseOp = 0.15 + rand() * 0.25;
        var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", cx.toFixed(1));
        c.setAttribute("cy", cy.toFixed(1));
        c.setAttribute("r", r.toFixed(2));
        c.setAttribute("fill", "#ffffff");
        c.setAttribute("opacity", baseOp.toFixed(2));
        starsSvg.appendChild(c);
        starEls.push({ el: c, base: baseOp });

      tl.to(".blob", { x: "+=40", y: "-=30", duration: 18, ease: "sine.inOut", repeat: -1, yoyo: true, stagger: 3 }, 0);
      starEls.forEach(function (s, idx) {
