<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Montserrat"; font-weight: 600; font-style: normal;
          src: url("assets/fonts/Montserrat-600-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Montserrat"; font-weight: 600; font-style: normal;
          src: url("assets/fonts/Montserrat-600-vietnamese.woff2") format("woff2");
          unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }

        #root { position: absolute; inset: 0; pointer-events: none; }
        #brand-anchor-logo { position: absolute; right: 48px; top: 48px; width: 100px; height: 108px; z-index: 90; }
        #brand-anchor-logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
        #brand-anchor-source { position: absolute; left: 48px; top: 48px; z-index: 90; display: flex; align-items: center;
          padding: 10px 18px; border-radius: 10px; background: rgba(17, 17, 17, 0.6); backdrop-filter: blur(2px); }
        #brand-anchor-source span { font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 21px;
          letter-spacing: 0.01em; color: #ffffff; white-space: nowrap; }
      </style>

      <!-- Fixed Brand Anchor — BOT BÁN HÀNG. Persistent from end of Hook to end of video,
           identical position/size every frame, no animation. NOT shown during Hook: Hook
           carries its own embedded logo + source + date. Mounted once at root as a
           sub-composition (logo top-right, source top-left). -->
      <div id="root" data-composition-id="brand-anchor" data-width="1080" data-height="1920">
        <div id="brand-anchor-logo">
          <img src="public/logo-bbh-mark.png" alt="">
        </div>
        <div id="brand-anchor-source">
          <span>Nguồn: Znews</span>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.to({}, { duration: 48.25 }, 0);
          window.__timelines["brand-anchor"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
