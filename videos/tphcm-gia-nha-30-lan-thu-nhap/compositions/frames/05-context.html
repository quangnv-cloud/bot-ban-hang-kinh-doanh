        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #111111;
          font-family: "Montserrat", Arial, sans-serif;
          color: #ffffff;
        }
        .ct-kicker {
          position: absolute; left: 64px; top: 212px;
          font-weight: 700; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;
          color: rgba(255, 255, 255, 0.78);
          opacity: 0;
        }

        .ct-row { position: absolute; left: 64px; right: 64px; }
        .ct-row-1 { top: 312px; }
        .ct-row-2 { top: 584px; }
        .ct-row-3 { top: 856px; }

        .ct-spark { display: block; width: 100%; height: 64px; opacity: 0; }
        .ct-spark path { fill: none; stroke: #e8441e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .ct-spark circle { fill: #e8441e; opacity: 0; }

        .ct-line { display: flex; align-items: baseline; gap: 18px; margin-top: 22px; padding-bottom: 30px; border-bottom: 1.5px solid rgba(255, 255, 255, 0.14); }
        .ct-row-3 .ct-line { border-bottom: none; }
        .ct-arrow { font-weight: 900; font-size: 32px; color: #e8441e; flex: none; opacity: 0; }
        .ct-text { font-weight: 700; font-size: 32px; line-height: 1.3; letter-spacing: 0.005em; color: #ffffff; opacity: 0; }

      <div id="root" data-composition-id="05-context" data-width="1080" data-height="1920">
        <div id="ct-kicker" class="clip ct-kicker" data-start="0" data-duration="9.1" data-track-index="0">Mục tiêu hạ tầng TP.HCM</div>

        <div class="ct-row ct-row-1">
          <svg class="ct-spark" id="ct-spark-1" viewBox="0 0 952 64" preserveAspectRatio="none">
            <path id="ct-path-1" d="M0,52 L120,40 L240,44 L360,26 L480,32 L600,16 L720,22 L840,8 L952,6" />
            <circle id="ct-dot-1" cx="946" cy="6" r="6"></circle>
          </svg>
          <div class="ct-line">
            <span class="ct-arrow" id="ct-arrow-1">▲</span>
            <span class="ct-text" id="ct-text-1"><span class="accent">200 km</span> đường sắt đô thị · mục tiêu 2030</span>
          </div>
        </div>

        <div class="ct-row ct-row-2">
          <svg class="ct-spark" id="ct-spark-2" viewBox="0 0 952 64" preserveAspectRatio="none">
            <path id="ct-path-2" d="M0,48 L120,44 L240,30 L360,34 L480,20 L600,24 L720,12 L840,16 L952,4" />
            <circle id="ct-dot-2" cx="946" cy="4" r="6"></circle>
          </svg>
          <div class="ct-line">
            <span class="ct-arrow" id="ct-arrow-2">▲</span>
            <span class="ct-text" id="ct-text-2"><span class="accent">Vành Đai 3</span> · kết nối sản xuất, cảng biển, sân bay</span>
          </div>
        </div>

        <div class="ct-row ct-row-3">
          <svg class="ct-spark" id="ct-spark-3" viewBox="0 0 952 64" preserveAspectRatio="none">
            <path id="ct-path-3" d="M0,54 L120,36 L240,40 L360,22 L480,28 L600,10 L720,18 L840,6 L952,2" />
            <circle id="ct-dot-3" cx="946" cy="2" r="6"></circle>
          </svg>
          <div class="ct-line">
            <span class="ct-arrow" id="ct-arrow-3">▲</span>
            <span class="ct-text" id="ct-text-3"><span class="accent">Vành Đai 4</span> · mở rộng thị trường lao động</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#ct-kicker", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.1);

          function revealRow(i, start) {
            var pathEl = document.getElementById("ct-path-" + i);
            var len = pathEl.getTotalLength();
            pathEl.style.strokeDasharray = len;
            pathEl.style.strokeDashoffset = len;

            tl.set("#ct-spark-" + i, { opacity: 1 }, start);
            tl.to(pathEl, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, start);
            tl.fromTo("#ct-dot-" + i, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)" }, start + 0.85);

            tl.fromTo(
              "#ct-arrow-" + i,
              { opacity: 0, x: -14 },
              { opacity: 1, x: 0, duration: 0.26, ease: "power3.out" },
              start + 0.95,
            );
            tl.fromTo(
              "#ct-text-" + i,
              { opacity: 0, x: -14 },
              { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" },
              start + 1.02,
            );
          }

          revealRow(1, 0.5);
          revealRow(2, 2.55);
          revealRow(3, 4.6);

          window.__timelines["05-context"] = tl;
        })();
      </script>
