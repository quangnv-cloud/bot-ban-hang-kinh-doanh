      <script>
        (function () {
          function fitLine(id, text, baseSize, minSize, weight, maxWidth) {
            var el = document.getElementById(id);
            if (!el) return;
            if (window.__hyperframes && window.__hyperframes.fitTextFontSize) {
              var fit = window.__hyperframes.fitTextFontSize(text, {
                fontFamily: "Montserrat",
                fontWeight: weight,
                maxWidth: maxWidth || 952,
                baseFontSize: baseSize,
                minFontSize: minSize,
              });
              el.style.fontSize = fit.fontSize + "px";
            } else {
              el.style.fontSize = baseSize + "px";
            }
          }

          fitLine("w2-headline", "Giá nhà TP.HCM vượt xa ngưỡng an toàn của các nước phát triển", 48, 34, 800);

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#w2-bg img", { scale: 1.05 }, { scale: 1.0, duration: 7.5, ease: "none" }, 0);

          tl.fromTo("#w2-kicker", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.1);

          tl.fromTo(
            "#w2-headline",
            { opacity: 0, filter: "blur(8px)", y: 12 },
            { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.4, ease: "expo.out" },
            0.32,
          );

          tl.fromTo(

            { opacity: 0, y: 30, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power3.out" },
            0.75,

          tl.fromTo("#w2-card-img", { scale: 1.1 }, { scale: 1.0, duration: 6.5, ease: "none" }, 0.75);

          tl.fromTo("#w2-card-caption", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.25);

          // Ticker bar: border draw-in via scaleX, then LIVE pulse + single scroll pass of the headline strip.
          tl.fromTo("#w2-ticker", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.5);

          tl.to(
            "#w2-ticker-dot",
            { scale: 1.35, opacity: 0.55, duration: 0.45, ease: "sine.inOut", repeat: 5, yoyo: true },
            2.0,
          );

          // Scroll the ticker text from just off the right edge of its track to fully past the left edge.
          var trackWrap = document.getElementById("w2-ticker-track").parentElement;
          var trackEl = document.getElementById("w2-ticker-track");
          var wrapWidth = trackWrap ? trackWrap.getBoundingClientRect().width || 846 : 846;
          var trackWidth = trackEl ? trackEl.getBoundingClientRect().width || 900 : 900;
          tl.fromTo(
            "#w2-ticker-track",
            { x: wrapWidth },
            { x: -trackWidth, duration: 5.6, ease: "none" },
            2.0,
          );

          window.__timelines["02-what-happened"] = tl;
        })();
