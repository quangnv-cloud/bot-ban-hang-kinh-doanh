<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 600;
          src: url('assets/fonts/Montserrat-600-latin.woff2') format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+FEFF, U+FFFD; }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 600;
          src: url('assets/fonts/Montserrat-600-vietnamese.woff2') format('woff2');
          unicode-range: U+0102-0103, U+1EA0-1EF9, U+20AB; }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 700;
          src: url('assets/fonts/Montserrat-700-latin.woff2') format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+FEFF, U+FFFD; }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 700;
          src: url('assets/fonts/Montserrat-700-vietnamese.woff2') format('woff2');
          unicode-range: U+0102-0103, U+1EA0-1EF9, U+20AB; }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 900;
          src: url('assets/fonts/Montserrat-900-latin.woff2') format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+FEFF, U+FFFD; }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 900;
          src: url('assets/fonts/Montserrat-900-vietnamese.woff2') format('woff2');
          unicode-range: U+0102-0103, U+1EA0-1EF9, U+20AB; }

        #root {
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          font-family: 'Montserrat', Arial, sans-serif;
        }

        #root .fdm-bg { position: absolute; inset: 0; background-color: #111111; overflow: hidden; }
        #root .fdm-bg-photo {
          position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px);
          object-fit: cover; object-position: 50% 38%;
          filter: blur(22px) brightness(0.55); opacity: 0.38;
        }
        #root .fdm-bg-scrim {
          position: absolute; inset: 0;
          background: radial-gradient(ellipse 900px 1400px at 50% 50%, rgba(17, 17, 17, 0.55) 0%, rgba(17, 17, 17, 0.78) 55%, rgba(17, 17, 17, 0.95) 100%);
        }

        #root .fdm-top-wrap { position: absolute; top: 300px; left: 0; width: 100%; text-align: center; }
        #root .fdm-top-label {
          display: inline-block; font-family: 'Montserrat', monospace; font-weight: 600; font-size: 25px;
          letter-spacing: 0.12em; text-transform: uppercase; color: #e8441e; opacity: 0;
        }

        #root .fdm-hero-wrap {
          position: absolute; top: 520px; left: 0; width: 100%;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #root .fdm-counter {
          text-align: center; font-variant-numeric: tabular-nums;
          font-family: 'Montserrat', Arial, sans-serif; font-weight: 900; font-size: 158px; line-height: 1;
          letter-spacing: -0.01em; color: #e8441e; text-shadow: 0 0 50px rgba(232,68,30,0.4);
          opacity: 0;
        }
        #root .fdm-unit {
          margin-top: 18px; font-weight: 800; font-size: 40px; letter-spacing: 0.01em; color: #ffffff; opacity: 0;
        }

        #root .fdm-cond-wrap { position: absolute; top: 1020px; left: 0; width: 100%; text-align: center; }
        #root .fdm-cond-label {
          display: inline-block; font-family: 'Montserrat', monospace; font-weight: 600; font-size: 23px;
          letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.72); opacity: 0;
          max-width: 820px;
        }

        #root .fdm-progress-wrap { position: absolute; top: 1150px; left: 140px; right: 140px; opacity: 0; }
        #root .fdm-progress-track { position: relative; width: 100%; height: 34px; border-radius: 17px; background: rgba(255,255,255,0.08); overflow: hidden; }
        #root .fdm-progress-fill { position: absolute; inset: 0; width: 100%; border-radius: 17px; background: linear-gradient(90deg, #e8441e, #ff7a4d); transform: scaleX(0); transform-origin: left center; }
        #root .fdm-progress-label { margin-top: 20px; display: flex; justify-content: space-between; font-weight: 700; font-size: 24px; color: rgba(255,255,255,0.55); }
        #root .fdm-progress-pct { font-weight: 900; font-size: 86px; color: #ffffff; text-align: center; margin-bottom: 6px; }
      </style>

      <div data-hf-id="hf-04root" id="root" data-composition-id="04-data-moment" data-width="1080" data-height="1920">
        <div data-hf-id="hf-04bg" class="fdm-bg clip" data-start="0" data-duration="7.70" data-track-index="0">
          <img data-hf-id="hf-04bgphoto" class="fdm-bg-photo" src="assets/images/hook-photo.jpg" alt="">
          <div data-hf-id="hf-04scrim" class="fdm-bg-scrim"></div>
        </div>

        <div data-hf-id="hf-04topwrap" class="fdm-top-wrap clip" data-start="0" data-duration="7.70" data-track-index="1">
          <div data-hf-id="hf-04toplabel" class="fdm-top-label" id="fdmTopLabel">Luỹ kế đến hết tháng 9/2026</div>
        </div>

        <div data-hf-id="hf-04herowrap" class="fdm-hero-wrap clip" data-start="0" data-duration="7.70" data-track-index="2">
          <span data-hf-id="hf-04counter" class="fdm-counter" id="fdmCounter">0</span>
          <span data-hf-id="hf-04unit" class="fdm-unit" id="fdmUnit">tỷ đồng trái phiếu Chính phủ</span>
        </div>

        <div data-hf-id="hf-04condwrap" class="fdm-cond-wrap clip" data-start="0" data-duration="7.70" data-track-index="3">
          <div data-hf-id="hf-04condlabel" class="fdm-cond-label" id="fdmCondLabel">Hoàn thành kế hoạch phát hành năm 2026</div>
        </div>

        <div data-hf-id="hf-04progwrap" class="fdm-progress-wrap clip" data-start="0" data-duration="7.70" data-track-index="4">
          <div data-hf-id="hf-04progpct" class="fdm-progress-pct" id="fdmProgressPct">0%</div>
          <div data-hf-id="hf-04progtrack" class="fdm-progress-track">
            <div data-hf-id="hf-04progfill" class="fdm-progress-fill" id="fdmProgressFill"></div>
          </div>
          <div data-hf-id="hf-04proglabel" class="fdm-progress-label">
            <span data-hf-id="hf-04proglabel-l">0%</span><span data-hf-id="hf-04proglabel-r">100% kế hoạch năm</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#fdmTopLabel", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.15);

          tl.set("#fdmCounter", { opacity: 1 }, 0.9);
          var counterEl = document.getElementById("fdmCounter");
          var counterState = { value: 0 };
          var COUNT_START = 0.9;
          var COUNT_DUR = 1.7;

          tl.to(counterState, {
            value: 299060,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: function () {
              counterEl.textContent = Math.round(counterState.value).toLocaleString("vi-VN");
            },
          }, COUNT_START);

          tl.fromTo("#fdmUnit", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, COUNT_START + COUNT_DUR - 0.1);

          tl.fromTo("#fdmCondLabel", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 3.1);

          tl.fromTo("#root .fdm-progress-wrap", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.9);

          var pctEl = document.getElementById("fdmProgressPct");
          var pctState = { value: 0 };
          tl.to(pctState, {
            value: 60,
            duration: 1.3,
            ease: "power2.out",
            onUpdate: function () {
              pctEl.textContent = Math.round(pctState.value) + "%";
            },
          }, 4.2);
          tl.fromTo("#fdmProgressFill", { scaleX: 0 }, { scaleX: 0.6, duration: 1.3, ease: "power2.out" }, 4.2);

          tl.to("#fdmProgressPct", { scale: 1.06, duration: 0.18, ease: "power1.out" }, 5.5)
            .to("#fdmProgressPct", { scale: 1, duration: 0.22, ease: "power1.in" }, 5.68);

          window.__timelines["04-data-moment"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
